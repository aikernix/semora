services:
  offline-modeling:
    build: .
    ports:
      - "127.0.0.1:${OFFLINE_PORT:-8015}:8015"
    environment:
      OFFLINE_MODEL_URL: ${OFFLINE_MODEL_URL:-}
      OFFLINE_MODEL_NAME: ${OFFLINE_MODEL_NAME:-}
      OFFLINE_MODEL_KEY: ${OFFLINE_MODEL_KEY:-}
      OFFLINE_ACCESS_PASSWORD: ${OFFLINE_ACCESS_PASSWORD:-}
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-300}"
      LLM_NO_DELIVERY_SECONDS: "${LLM_NO_DELIVERY_SECONDS:-60}"
      LLM_STREAM_ENABLED: "${LLM_STREAM_ENABLED:-true}"
      LLM_STREAM_INCLUDE_USAGE: "${LLM_STREAM_INCLUDE_USAGE:-true}"
      LLM_REQUEST_RETRIES: "${LLM_REQUEST_RETRIES:-1}"
      LLM_ENABLE_THINKING: "${LLM_ENABLE_THINKING:-false}"
      RELATIONSHIP_NO_DELIVERY_SECONDS: "${RELATIONSHIP_NO_DELIVERY_SECONDS:-300}"
      RELATIONSHIP_MODEL_CONCURRENCY: "${RELATIONSHIP_MODEL_CONCURRENCY:-3}"
      RELATIONSHIP_RESPONSE_FORMAT: "${RELATIONSHIP_RESPONSE_FORMAT:-json_object}"
      RELATIONSHIP_THINKING_MODE: "${RELATIONSHIP_THINKING_MODE:-inherit}"
      RELATIONSHIP_AGENT_GROUP_THRESHOLD: "${RELATIONSHIP_AGENT_GROUP_THRESHOLD:-40}"
      RELATIONSHIP_AGENT_MAX_STEPS: "${RELATIONSHIP_AGENT_MAX_STEPS:-8}"
      RELATIONSHIP_MAX_MODEL_CALLS: "${RELATIONSHIP_MAX_MODEL_CALLS:-2000}"
    volumes:
      - offline-data:/data
volumes:
  offline-data:
