{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "semora.fullname" . }}-default-deny-ingress
  labels:
    {{- include "semora.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "semora.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "semora.fullname" . }}-web-ingress
  labels:
    {{- include "semora.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "semora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes: [Ingress]
  ingress:
    - ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "semora.fullname" . }}-api-ingress
  labels:
    {{- include "semora.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "semora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "semora.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports: [{ protocol: TCP, port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "semora.fullname" . }}-internal-ingress
  labels:
    {{- include "semora.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [knowledge, ontology, semantic-planner, executor, audit-exporter]
    matchLabels:
      {{- include "semora.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "semora.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
{{- end }}
