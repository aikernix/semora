apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semora.fullname" . }}-audit-exporter
  labels:
    {{- include "semora.labels" . | nindent 4 }}
    app.kubernetes.io/component: audit-exporter
spec:
  replicas: {{ .Values.replicas.auditExporter }}
  selector:
    matchLabels:
      {{- include "semora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: audit-exporter
  template:
    metadata:
      labels:
        {{- include "semora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: audit-exporter
    spec:
      serviceAccountName: {{ include "semora.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: audit-exporter
          image: {{ include "semora.image" .Values.images.auditExporter }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: 8004 }]
          {{- if .Values.auditArchive.kafkaSecret }}
          envFrom:
            - secretRef: { name: {{ .Values.auditArchive.kafkaSecret }} }
          {{- end }}
          env:
            - name: AUDIT_EXPORTER_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.auditExporterRuntimeSecret }}, key: {{ .Values.database.auditExporterRuntimeKey }} } }
            - name: AUDIT_ARCHIVE_S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: {{ .Values.auditArchive.objectStoreSecret }}, key: {{ .Values.auditArchive.objectStoreKeys.endpoint }} } }
            - name: AUDIT_ARCHIVE_S3_BUCKET
              valueFrom: { secretKeyRef: { name: {{ .Values.auditArchive.objectStoreSecret }}, key: {{ .Values.auditArchive.objectStoreKeys.bucket }} } }
            - name: AUDIT_ARCHIVE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.auditArchive.objectStoreSecret }}, key: {{ .Values.auditArchive.objectStoreKeys.accessKey }} } }
            - name: AUDIT_ARCHIVE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.auditArchive.objectStoreSecret }}, key: {{ .Values.auditArchive.objectStoreKeys.secretKey }} } }
            - name: AUDIT_ARCHIVE_S3_REGION
              valueFrom: { secretKeyRef: { name: {{ .Values.auditArchive.objectStoreSecret }}, key: {{ .Values.auditArchive.objectStoreKeys.region }} } }
            - { name: AUDIT_ARCHIVE_S3_SSE_MODE, value: {{ .Values.auditArchive.sseMode | quote }} }
            - name: AUDIT_ARCHIVE_S3_KMS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.auditArchive.objectStoreSecret }}, key: {{ .Values.auditArchive.objectStoreKeys.kmsKeyId }} } }
            - { name: AUDIT_ARCHIVE_S3_REQUIRE_VERSIONING, value: {{ .Values.auditArchive.requireVersioning | quote }} }
            - { name: AUDIT_ARCHIVE_WORM_MODE, value: {{ .Values.auditArchive.wormMode | quote }} }
            - { name: AUDIT_ARCHIVE_RETENTION_YEARS, value: {{ .Values.auditArchive.retentionYears | quote }} }
            - { name: AUDIT_ARCHIVE_POLL_SECONDS, value: {{ .Values.auditArchive.pollSeconds | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.telemetry.otlpEndpoint | quote }} }
            - { name: SEMORA_ENVIRONMENT, value: {{ .Values.telemetry.environment | quote }} }
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.internalToken.secretName }}, key: {{ .Values.internalToken.secretKey }} } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 20, periodSeconds: 30 }
          resources: {{ toYaml .Values.resources.auditExporter | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
