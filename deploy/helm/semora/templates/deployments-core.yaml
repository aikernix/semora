apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semora.fullname" . }}-ontology
  labels:
    {{- include "semora.labels" . | nindent 4 }}
    app.kubernetes.io/component: ontology
spec:
  replicas: {{ .Values.replicas.ontology }}
  selector:
    matchLabels:
      {{- include "semora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ontology
  template:
    metadata:
      labels:
        {{- include "semora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ontology
    spec:
      serviceAccountName: {{ include "semora.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ontology
          image: {{ include "semora.image" .Values.images.ontology }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - name: ONTOLOGY_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.ontologyRuntimeSecret }}, key: {{ .Values.database.ontologyRuntimeKey }} } }
            - { name: REQUIRE_INTERNAL_TOKEN, value: "true" }
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.internalToken.secretName }}, key: {{ .Values.internalToken.secretKey }} } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: {{ toYaml .Values.resources.ontology | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semora.fullname" . }}-semantic-planner
  labels:
    {{- include "semora.labels" . | nindent 4 }}
    app.kubernetes.io/component: semantic-planner
spec:
  replicas: {{ .Values.replicas.semanticPlanner }}
  selector:
    matchLabels:
      {{- include "semora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: semantic-planner
  template:
    metadata:
      labels:
        {{- include "semora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: semantic-planner
    spec:
      serviceAccountName: {{ include "semora.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: semantic-planner
          image: {{ include "semora.image" .Values.images.semanticPlanner }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: 8001 }]
          env:
            - { name: REQUIRE_INTERNAL_TOKEN, value: "true" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.telemetry.otlpEndpoint | quote }} }
            - { name: SEMORA_ENVIRONMENT, value: {{ .Values.telemetry.environment | quote }} }
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.internalToken.secretName }}, key: {{ .Values.internalToken.secretKey }} } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: {{ toYaml .Values.resources.semanticPlanner | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semora.fullname" . }}-executor
  labels:
    {{- include "semora.labels" . | nindent 4 }}
    app.kubernetes.io/component: executor
spec:
  replicas: {{ .Values.replicas.executor }}
  selector:
    matchLabels:
      {{- include "semora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: executor
  template:
    metadata:
      labels:
        {{- include "semora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: executor
    spec:
      serviceAccountName: {{ include "semora.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: executor
          image: {{ include "semora.image" .Values.images.executor }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: 8002 }]
          envFrom:
            - secretRef: { name: {{ .Values.executor.datasourceSecret }} }
          env:
            - { name: REQUIRE_INTERNAL_TOKEN, value: "true" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.telemetry.otlpEndpoint | quote }} }
            - { name: SEMORA_ENVIRONMENT, value: {{ .Values.telemetry.environment | quote }} }
            - { name: QUERY_TIMEOUT_MS, value: {{ .Values.executor.queryTimeoutMs | quote }} }
            - { name: MAX_RESULT_ROWS, value: {{ .Values.executor.maxResultRows | quote }} }
            - { name: MAX_RESULT_BYTES, value: {{ .Values.executor.maxResultBytes | quote }} }
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.internalToken.secretName }}, key: {{ .Values.internalToken.secretKey }} } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: {{ toYaml .Values.resources.executor | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
