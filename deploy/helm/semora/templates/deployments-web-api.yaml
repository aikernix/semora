apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semora.fullname" . }}-web
  labels:
    {{- include "semora.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels:
      {{- include "semora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "semora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "semora.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "semora.image" .Values.images.web }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: {{ toYaml .Values.resources.web | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /usr/share/nginx/html/semora-config.js, subPath: semora-config.js, readOnly: true }
            - { name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: {{ include "semora.fullname" . }}-web }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "semora.fullname" . }}-api
  labels:
    {{- include "semora.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels:
      {{- include "semora.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "semora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "semora.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "semora.image" .Values.images.api }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: EXECUTOR_URL, value: "http://{{ include "semora.fullname" . }}-executor:8002" }
            - { name: KNOWLEDGE_SERVICE_URL, value: "http://{{ include "semora.fullname" . }}-knowledge:8003" }
            - { name: SEMANTIC_PLANNER_URL, value: "http://{{ include "semora.fullname" . }}-semantic-planner:8001" }
            - { name: ONTOLOGY_URL, value: "http://{{ include "semora.fullname" . }}-ontology:8081" }
            - { name: AUDIT_EXPORTER_URL, value: "http://{{ include "semora.fullname" . }}-audit-exporter:8004" }
            - { name: AUTH_REQUIRED, value: {{ .Values.oidc.authRequired | quote }} }
            - { name: OIDC_ISSUER, value: {{ .Values.oidc.issuer | quote }} }
            - { name: OIDC_JWKS_URL, value: {{ .Values.oidc.jwksUrl | quote }} }
            - { name: OIDC_AUDIENCE, value: {{ .Values.oidc.audience | quote }} }
            - { name: CORS_ORIGINS, value: {{ printf "https://%s" .Values.ingress.host | quote }} }
            - { name: REQUIRE_INTERNAL_TOKEN, value: "true" }
            - { name: ALLOW_LOCAL_PLANNER_FALLBACK, value: "false" }
            - { name: LLM_MODE, value: {{ .Values.llm.mode | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.telemetry.otlpEndpoint | quote }} }
            - { name: SEMORA_ENVIRONMENT, value: {{ .Values.telemetry.environment | quote }} }
            - name: METADATA_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.metadataRuntimeSecret }}, key: {{ .Values.database.metadataRuntimeKey }} } }
            - name: LANGGRAPH_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.langgraphSecret }}, key: {{ .Values.database.langgraphKey }} } }
            - name: INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.internalToken.secretName }}, key: {{ .Values.internalToken.secretKey }} } }
            {{- if .Values.llm.secretName }}
            - name: LLM_BASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.llm.secretName }}, key: {{ .Values.llm.baseUrlKey }} } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.llm.secretName }}, key: {{ .Values.llm.apiKeyKey }} } }
            - name: LLM_MODEL
              valueFrom: { secretKeyRef: { name: {{ .Values.llm.secretName }}, key: {{ .Values.llm.modelKey }} } }
            {{- end }}
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
