apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "semora.fullname" . }}-metadata-migrate
  labels:
    {{- include "semora.labels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "semora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metadata-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "semora.image" .Values.images.migrator }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - { name: METADATA_API_ROLE, value: {{ .Values.database.apiRole | quote }} }
            - { name: AUDIT_EXPORTER_DATABASE_ROLE, value: {{ .Values.database.auditExporterRole | quote }} }
            - name: METADATA_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.metadataMigrationSecret }}, key: {{ .Values.database.metadataMigrationKey }} } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
---
