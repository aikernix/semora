apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "semora.fullname" . }}-knowledge-migrate
  labels:
    {{- include "semora.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "semora.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: knowledge-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "semora.image" .Values.images.knowledge }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python", "-m", "app.migrate"]
          securityContext: {{ toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - { name: SEMORA_DEMO_SEED, value: "false" }
            - { name: KNOWLEDGE_OBJECT_STORE, value: "s3" }
            - { name: KNOWLEDGE_DATA_DIR, value: "/data/uploads" }
            - name: KNOWLEDGE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.knowledgeMigrationSecret }}, key: {{ .Values.database.knowledgeMigrationKey }} } }
            - name: KNOWLEDGE_S3_ENDPOINT
              valueFrom: { secretKeyRef: { name: {{ .Values.knowledge.objectStoreSecret }}, key: {{ .Values.knowledge.objectStoreKeys.endpoint }} } }
            - name: KNOWLEDGE_S3_BUCKET
              valueFrom: { secretKeyRef: { name: {{ .Values.knowledge.objectStoreSecret }}, key: {{ .Values.knowledge.objectStoreKeys.bucket }} } }
            - name: KNOWLEDGE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.knowledge.objectStoreSecret }}, key: {{ .Values.knowledge.objectStoreKeys.accessKey }} } }
            - name: KNOWLEDGE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.knowledge.objectStoreSecret }}, key: {{ .Values.knowledge.objectStoreKeys.secretKey }} } }
            - name: KNOWLEDGE_S3_REGION
              valueFrom: { secretKeyRef: { name: {{ .Values.knowledge.objectStoreSecret }}, key: {{ .Values.knowledge.objectStoreKeys.region }} } }
            - { name: KNOWLEDGE_S3_SSE_MODE, value: {{ .Values.knowledge.sseMode | quote }} }
            - name: KNOWLEDGE_S3_KMS_KEY_ID
              valueFrom: { secretKeyRef: { name: {{ .Values.knowledge.objectStoreSecret }}, key: {{ .Values.knowledge.objectStoreKeys.kmsKeyId }} } }
            - { name: KNOWLEDGE_S3_REQUIRE_VERSIONING, value: {{ .Values.knowledge.requireVersioning | quote }} }
          volumeMounts:
            - { name: data, mountPath: /data/uploads }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
