{{- $root := . -}}
{{- range $name, $port := dict "web" 8080 "api" 8000 "knowledge" 8003 "ontology" 8081 "semantic-planner" 8001 "executor" 8002 "audit-exporter" 8004 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "semora.fullname" $root }}-{{ $name }}
  labels:
    {{- include "semora.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if eq $name "web" }}
  type: {{ $root.Values.service.web.type }}
  {{- end }}
  selector:
    {{- include "semora.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ if eq $name "web" }}{{ $root.Values.service.web.port }}{{ else }}{{ $port }}{{ end }}
      targetPort: http
{{- end }}
