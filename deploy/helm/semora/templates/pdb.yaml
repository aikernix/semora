{{- if .Values.podDisruptionBudget.enabled }}
{{- $root := . -}}
{{- range $component, $replicas := dict "web" .Values.replicas.web "api" .Values.replicas.api "knowledge" .Values.replicas.knowledge "knowledge-worker" .Values.replicas.knowledgeWorker "ontology" .Values.replicas.ontology "semantic-planner" .Values.replicas.semanticPlanner "executor" .Values.replicas.executor "audit-exporter" .Values.replicas.auditExporter }}
{{- if gt (int $replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "semora.fullname" $root }}-{{ $component }}
  labels:
    {{- include "semora.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  minAvailable: {{ $root.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "semora.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
{{- end }}
