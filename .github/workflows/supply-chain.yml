name: Supply chain gate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify pins, locks, image tags, and upstream provenance
        run: python scripts/verify_dependency_policy.py

  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "services/*/requirements*.txt"
      - name: Install scanners
        run: python -m pip install pip-audit==2.10.0 pip-licenses==5.5.5
      - name: Audit each runtime dependency set and emit CycloneDX SBOMs
        shell: bash
        run: |
          mkdir -p artifacts/sbom
          for file in services/*/requirements.txt; do
            service="$(basename "$(dirname "$file")")"
            pip-audit --strict --progress-spinner off -r "$file" \
              --format cyclonedx-json --output "artifacts/sbom/python-${service}.cdx.json"
          done
      - name: Enforce Python license policy
        shell: bash
        run: |
          for file in services/*/requirements.txt; do python -m pip install -r "$file"; done
          pip-licenses --format=json --with-urls --output-file=artifacts/python-licenses.json
          python scripts/check_python_licenses.py artifacts/python-licenses.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: python-sbom-and-licenses
          path: artifacts/

  web-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Enforce runtime license allowlist
        run: >-
          npx --yes license-checker-rseidelsohn@5.0.1 --production
          --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;MPL-2.0;CC0-1.0;Unlicense"
      - name: Emit CycloneDX SBOM
        run: >-
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1
          --omit dev --output-file web.cdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: web-sbom
          path: apps/web/web.cdx.json

  ontology-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ontology
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: services/ontology/go.sum
      - run: go mod verify
      - run: go test ./...
      - name: Reachability-aware vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Emit CycloneDX SBOM
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 mod \
            -licenses -json -output ontology.cdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ontology-sbom
          path: services/ontology/ontology.cdx.json
