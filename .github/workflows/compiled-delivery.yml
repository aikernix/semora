name: Compiled delivery validation

on:
  push:
    branches: [codex/compiled-delivery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service: [api, executor]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build compiled runtime
        run: >-
          docker build -f deploy/compiled/Dockerfile.python
          --build-arg SERVICE=${{ matrix.service }}
          -t semora-${{ matrix.service }}:compiled-check .
      - name: Check payload and native runtime
        run: |
          docker run --rm --entrypoint python semora-${{ matrix.service }}:compiled-check /usr/local/bin/semora-verify-payload /app
          docker run --rm --entrypoint python -v "$PWD/deploy/compiled:/checks:ro" semora-${{ matrix.service }}:compiled-check /checks/smoke_runtime.py ${{ matrix.service }}
      - name: Source and packaging regressions
        if: matrix.service == 'api'
        run: |
          docker run --rm --user 0 --entrypoint sh \
            -v "$PWD:/repo:ro" -w /repo \
            -e PYTHONPATH=/repo:/repo/services/api:/repo/services/agent:/repo/packages/contracts/python:/repo/packages/telemetry/python:/tmp/test-deps \
            semora-api:compiled-check -c '
              python -m pip install --no-cache-dir --target /tmp/test-deps pytest==8.3.5 PyMySQL==1.1.2 &&
              python -m pytest -p no:cacheprovider -q services/api/tests deploy/compiled/test_verify_payload.py
            '
      - name: API critical regressions against native modules
        if: matrix.service == 'api'
        run: |
          docker run --rm --user 0 --entrypoint sh \
            -v "$PWD/services/api/tests:/tests:ro" \
            -e PYTHONPATH=/app:/tmp/test-deps:/tests \
            semora-api:compiled-check -c '
              python -m pip install --no-cache-dir --target /tmp/test-deps pytest==8.3.5 &&
              python -m pytest -c /dev/null --rootdir=/tests -p no:cacheprovider -q \
                /tests/test_sql_native.py /tests/test_sql_dialect_contract.py \
                /tests/test_sql_model_context.py /tests/test_query_context_wire.py \
                /tests/test_result_summary.py /tests/test_relationship_keywords.py \
                /tests/test_relationship_research.py /tests/test_modeling_controls.py \
                /tests/test_cross_source_discovery.py /tests/test_domain_relationships.py \
                /tests/test_model_requests.py \
                -k "not executor_curated_diagnostic_and_decimal_metadata"
            '
