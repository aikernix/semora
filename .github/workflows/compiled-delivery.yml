name: Compiled delivery validation

on:
  push:
    branches: [codex/compiled-delivery]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service: [api, executor]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build compiled runtime
        run: >-
          docker build -f deploy/compiled/Dockerfile.python
          --build-arg SERVICE=${{ matrix.service }}
          -t semora-${{ matrix.service }}:compiled-check .
      - name: Check payload and native runtime
        run: |
          docker run --rm --entrypoint python semora-${{ matrix.service }}:compiled-check /usr/local/bin/semora-verify-payload /app
          docker run --rm --entrypoint python -v "$PWD/deploy/compiled:/checks:ro" semora-${{ matrix.service }}:compiled-check /checks/smoke_runtime.py ${{ matrix.service }}
      - name: API regressions against compiled modules
        if: matrix.service == 'api'
        run: |
          docker run --rm --user 0 --entrypoint sh \
            -v "$PWD/services/api/tests:/tests:ro" \
            -e PYTHONPATH=/app:/tmp/test-deps:/tests \
            semora-api:compiled-check -c '
              python -m pip install --no-cache-dir --target /tmp/test-deps pytest==8.3.5 &&
              python -m pytest -c /dev/null --rootdir=/tests -p no:cacheprovider -q /tests \
                --ignore=/tests/test_datasources.py --ignore=/tests/test_executor_masking.py \
                --ignore=/tests/test_executor_cancel.py --ignore=/tests/test_executor_errors.py \
                --ignore=/tests/test_mysql.py --ignore=/tests/test_connection_settings.py \
                --ignore=/tests/test_multidatabase.py --ignore=/tests/test_database_live.py
            '
