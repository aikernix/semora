location /offline-modeling/ {
  client_max_body_size 66m;
  set $offline_modeling http://offline-modeling:8015;
  rewrite ^/offline-modeling(/.*)$ $1 break;
  proxy_pass $offline_modeling$uri$is_args$args;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_read_timeout 650s;
}

location ~ ^/api/v1/domains/[^/]+/offline-sql$ {
  set $semora_api http://api:8000;
  proxy_pass $semora_api$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_read_timeout 650s;
}
