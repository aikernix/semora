[tool.pytest.ini_options]
pythonpath = ["packages/query-core/python", "services/api", "services/agent", "packages/contracts/python", "packages/telemetry/python", "packages/s3-security/python"]
testpaths = ["services/api/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

